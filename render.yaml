services:
  - type: web
    name: stundenplan-app
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py makemigrations scheduler && python manage.py migrate && python manage.py ensure_admin && python manage.py collectstatic --noinput"
    startCommand: "gunicorn wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
